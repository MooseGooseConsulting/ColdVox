[package]
name = "coldvox-gui"
version = "0.1.0"
edition = "2021"
description = "ColdVox overlay GUI — Tauri v2 + React host shell"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = [] }
tokio = { version = "1", features = ["time"] }
