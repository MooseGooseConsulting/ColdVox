# Windows live override for the canonical HTTP-remote Parakeet path.
# Use via `COLDVOX_CONFIG_PATH=config/windows-parakeet.toml` or the
# `scripts/run-coldvox.ps1` / `just windows-live` entrypoints.
#
# The normal startup path still discovers `config/default.toml`.
# `config/plugins.json` remains plugin-manager persistence and does not replace
# this file when launching `coldvox` directly.
#
# This profile carries no `[stt.remote]` endpoint config: the remote HTTP
# endpoint (canonical: the cluster parakeet service at http://192.168.30.207:5092)
# is inherited from `config/default.toml`. Override `[stt.remote] base_url`
# there (or in a copy of this file) to point at the local compose fallback
# (ops/parakeet/docker-compose.yml on http://localhost:5092). Bring the
# fallback container up with:
#
#     just parakeet-up
#     just parakeet-health
#
# Validate the container-backed path locally with:
#
#     just parakeet-validate
#
# Or bring the container up directly with:
#
#     docker compose -f ops/parakeet/docker-compose.yml up -d parakeet-cpu
#
# The optional GPU profile (parakeet-gpu, port 8200) uses a different
# non-OpenAI API surface and is not the wired default.

[injection]
allow_enigo = true

[stt]
preferred = "http-remote"
fallbacks = []
require_local = false
language = "en"

