name: CI (Minimal)

# Default PR/push gate. Keep GitHub-hosted usage intentionally tiny here:
# repo integrity and rustfmt only. Workspace builds/tests/clippy/docs run on the
# free self-hosted Fedora/Nobara runner, and live/Whisper checks stay manual.

on:
  push:
    branches: [main, tauri-base, "release/*"]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "justfile"
      - "mise.toml"
      - "pyproject.toml"
      - "config/**"
      - "crates/**"
      - "ops/parakeet/**"
      - "scripts/**"
      - "scripts/ci/**"
      - "scripts/lint_repo_integrity.py"
      - ".test-skip-baseline.json"
  pull_request:
    branches: [main, tauri-base]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "justfile"
      - "mise.toml"
      - "pyproject.toml"
      - "config/**"
      - "crates/**"
      - "ops/parakeet/**"
      - "scripts/**"
      - "scripts/ci/**"
      - "scripts/lint_repo_integrity.py"
      - ".test-skip-baseline.json"
  workflow_dispatch:
    inputs:
      run_live_text_injection:
        description: "Run optional live-display text injection tests"
        required: false
        default: false
        type: boolean
      run_whisper_e2e:
        description: "Run optional Whisper golden-master E2E test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-minimal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: "-D warnings"
  CARGO_TERM_COLOR: always

jobs:
  repo-integrity:
    name: Repo Integrity Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run repo integrity checks
        env:
          SKIP_INTEGRITY_CHECKS: "1,2,3,4,6"
        run: python3 scripts/lint_repo_integrity.py

  format:
    name: Rust Format (hosted, cheap)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Heavyweight Rust compilation stays off GitHub-hosted minutes.
  check:
    name: Check (${{ matrix.rust }})
    runs-on: [self-hosted, Linux, X64, fedora, nobara]
    timeout-minutes: 45
    strategy:
      matrix:
        rust: [stable, "1.90"] # MSRV
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Get Rust version
        id: rust-version
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.rust-version.outputs.version }}
      
      - name: Type check
        run: cargo check --workspace --all-targets --locked
      
      - name: Build
        run: cargo build --workspace --locked

  # Clippy and cargo doc are useful safety checks, but expensive enough to keep
  # on the self-hosted runner rather than hosted Ubuntu.
  lint:
    name: Clippy & Rustdoc (self-hosted)
    runs-on: [self-hosted, Linux, X64, fedora, nobara]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Get Rust version
        id: rust-version
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.rust-version.outputs.version }}
      
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      
      - name: Build docs
        run: cargo doc --workspace --no-deps --locked

  # Unit and integration tests (not E2E)
  test:
    name: Test
    runs-on: [self-hosted, Linux, X64, fedora, nobara]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Get Rust version
        id: rust-version
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.rust-version.outputs.version }}
      
      # Core build dependencies only (no X11/text injection stuff)
      - name: Verify core deps
        run: |
          set -euo pipefail
          for cmd in gcc g++ make pkg-config; do
            command -v $cmd || { echo "Missing: $cmd"; exit 1; }
          done
          pkg-config --exists alsa || { echo "Missing: libalsa-dev"; exit 1; }
      
      - name: Run tests
        run: |
          # Use nextest if available, otherwise fallback
          if command -v cargo-nextest &>/dev/null; then
            cargo nextest run --workspace --locked
          else
            cargo test --workspace --locked
          fi

  # Optional: Text injection tests (only if tools available)
  text-injection:
    name: Text Injection (Optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_text_injection == true
    runs-on: [self-hosted, Linux, X64, fedora, nobara]
    continue-on-error: true # Don't fail CI if this fails
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Get Rust version
        id: rust-version
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.rust-version.outputs.version }}
      
      - name: Check if tools available
        id: check_tools
        run: |
          has_tools=true
          for tool in xdotool ydotool wl-paste xclip; do
            if ! command -v $tool &>/dev/null; then
              echo "Missing: $tool"
              has_tools=false
            fi
          done
          if [[ -z "${DISPLAY:-}" || "$DISPLAY" == ":99" ]]; then
            echo "Live DISPLAY is missing or points at quarantined :99"
            has_tools=false
          fi
          echo "available=$has_tools" >> $GITHUB_OUTPUT
      
      - name: Run text injection tests
        if: steps.check_tools.outputs.available == 'true'
        run: |
          dbus-run-session -- cargo test -p coldvox-text-injection --locked
      
      - name: Skip text injection tests
        if: steps.check_tools.outputs.available != 'true'
        run: echo "⚠️ Skipping - X11 tools not available"

  # Optional: Whisper E2E tests (only if model available)
  whisper-e2e:
    name: Whisper E2E (Optional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_whisper_e2e == true
    runs-on: [self-hosted, Linux, X64, fedora, nobara]
    continue-on-error: true # Don't fail CI if this fails
    env:
      WHISPER_MODEL_SIZE: tiny  # Use tiny model for minimal CI
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      
      - name: Get Rust version
        id: rust-version
        run: echo "version=$(rustc --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT
      
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.rust-version.outputs.version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      
      - name: Setup Whisper model
        id: setup
        run: bash scripts/ci/setup-whisper-cache.sh
      
      - name: Run Whisper Golden Master test
        env:
          WHISPER_MODEL_PATH: ${{ steps.setup.outputs.model_path }}
          WHISPER_MODEL_SIZE: ${{ steps.setup.outputs.model_size }}
        run: |
          uv venv .venv --python 3.12
          uv sync --locked
          export PYTHONPATH=$(uv run --with faster-whisper python -c "import site; print(site.getsitepackages()[0])")
          cargo test -p coldvox-app --test golden_master -- --nocapture
      
      - name: Skip Whisper E2E
        if: steps.setup.outputs.model_path == ''
        run: echo "⚠️ Skipping - Whisper model not available"
