problem_statement: "ColdVox needs a durable recovery path that consolidates active feature work, validates the real voice pipeline with live hardware, and reduces unnecessary GitHub-hosted CI minutes while preserving main as the stable trunk."
north_star: "Restore a reliable Rust voice pipeline for Windows-first development: audio capture -> VAD -> Parakeet HTTP/containerized STT -> text injection."
key_decisions: [{id: "branch_main", decision: "main is the GitHub default and stable trunk."}, {id: "branch_tauri_base", decision: "tauri-base is the feature and integration trunk defined by CI architecture."}, {id: "consolidation_flow", decision: "feat/codex work consolidates into tauri-base before any promotion to main."}, {id: "promotion_gate", decision: "tauri-base promotes to main only through the documented validation gate."}, {id: "stt_forward_path", decision: "ops/parakeet Parakeet-HTTP/containerized STT is the forward STT path."}, {id: "hardware_validation", decision: "live hardware tests are available on the target platform and are required validation signals, not mocks."}, {id: "ci_cost_control", decision: "expensive, container, and hardware tests must be routed appropriately while lightweight checks keep tight triggers."}]
in_scope: ["branch consolidation policy for recovery work", "Parakeet HTTP/containerized STT validation under ops/parakeet", "Windows local validation using the canonical just recipes", "live audio/display/clipboard hardware validation where required", "CI trigger and runner-routing improvements that reduce hosted minutes", "concise documentation that agents can use as execution context"]
out_of_scope: ["declaring Whisper, Coqui, Leopard, or Silero-STT stubs production-ready", "replacing the STT model implementation itself", "promoting tauri-base to main without the documented gate", "mocking live hardware tests as a substitute for runtime validation", "bypassing pull requests, branch protection, or review gates"]
requirements: [{id: "R1", title: "Preserve stable trunk policy", priority: "must", requirement: "main remains the default/stable trunk; recovery feature work targets tauri-base first.", acceptance: ["recovery PRs identify the intended trunk before implementation", "main-bound promotion originates from tauri-base only after validation"]}, {id: "R2", title: "Consolidate active feat/codex work", priority: "must", requirement: "active feat/codex recovery work is reconciled into tauri-base before promotion.", acceptance: ["branch inventory identifies active Parakeet/container/STT changes", "conflicts are resolved against tauri-base as the integration baseline"]}, {id: "R3", title: "Validate Parakeet HTTP container path", priority: "must", requirement: "ops/parakeet remains the forward path for containerized STT validation.", acceptance: ["container lifecycle is documented through the canonical command surface", "STT validation exercises HTTP/container behavior, not only compile-time feature flags"]}, {id: "R4", title: "Require live hardware validation", priority: "must", requirement: "live validation uses real Windows/audio/display/input capabilities when testing runtime behavior.", acceptance: ["just windows-run-preflight succeeds or fails with actionable prerequisite errors", "just windows-smoke and just test are recorded with artifact paths", "optional live GPU gate is run with COLDVOX_RUN_WINDOWS_LIVE when required"]}, {id: "R5", title: "Reduce GitHub-hosted CI minutes", priority: "should", requirement: "CI runs cheap checks on GitHub-hosted runners and routes expensive/container/hardware work to appropriate runners.", acceptance: ["triggers are narrowed to meaningful branch and path events", "container or hardware jobs do not run on every trivial documentation-only change unless required", "self-hosted jobs are used for hardware-only validation signals"]}]
validation_gates: {local_windows_required: {commands: ["just windows-run-preflight", "just windows-smoke", "just test"], artifacts: "logs/windows-validation/<timestamp>-<mode>/"}, local_windows_live_optional_until_required: {environment: {COLDVOX_RUN_WINDOWS_LIVE: "1"}, command: "just test", use_when: "runtime, GPU, Parakeet, or injection behavior is under review"}, promotion_to_main: {source_branch: "tauri-base", target_branch: "main", requires: ["documented local Windows validation artifacts", "CI architecture gate compliance", "manual review for main because main has no automerge"]}}
success_metrics: ["tauri-base contains consolidated recovery work with passing required checks", "Parakeet HTTP/containerized STT path is validated through live or container runtime evidence", "main receives only gated, validated promotions from tauri-base", "CI usage shifts expensive work away from GitHub-hosted runners where possible", "agents can infer branch, STT, CI, and validation policy from this PRD plus the plan"]
risks: [{id: "branch_drift", risk: "feat/codex branches diverge from tauri-base and create integration conflicts.", mitigation: "inventory branches first and consolidate in small PRs against tauri-base."}, {id: "hardware_gap", risk: "mocked tests mask failures in audio, display, clipboard, GPU, or injection behavior.", mitigation: "require live validation artifacts for runtime-sensitive work."}, {id: "ci_spend_regression", risk: "container and hardware checks consume unnecessary GitHub-hosted minutes.", mitigation: "tighten triggers and route expensive jobs to self-hosted or local validation paths."}]
